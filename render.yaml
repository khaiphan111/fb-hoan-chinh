services:
  - type: web
    name: fb-admin-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Che do WEB_ONLY: chi phuc vu API + web admin, KHONG polling bot Telegram,
    # KHONG chay jobs nen (bot van chay tren VM).
    # -> goi free dung duoc (lan mo dau tien sau khi "ngu" se cham ~30-60s).
    # Muon mo la len ngay thi doi sang plan: starter.
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: WEB_ONLY
        value: "1"
      # Bat buoc: set trong Render Dashboard (Environment), KHONG commit vao repo
      - key: SUPABASE_DB_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: ADMIN_TG_ID
        sync: false
      # Tuy chon (de trong neu khong dung)
      - key: FB_AVATAR_TOKEN
        sync: false
      - key: ZALO_BOT_TOKEN
        sync: false
      - key: WEB_DOMAIN
        sync: false
